# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# No MongoDB is needed here, deliberately.

RELOAD_HTTP=""

RELOAD_SERVER="
        location /probe/ {
            mongo mongodb://127.0.0.1:17099/?serverSelectionTimeoutMS=500;
            gridfs reloadtest field=_id type=objectid;
        }"

# The probe asks for a well-formed object id from a port nothing listens on,
# so the module tries to reach its database and gives up: 503.
#
# That is what makes this a question about the module rather than about the
# server.  A reload that dropped the module leaves the location without a
# content handler, and nginx answers 404; one that kept the module but lost
# its connection pool answers 500.  Only a module that is still there and
# still trying answers 503.
RELOAD_EXPECT='503'

reload_probe() {
	curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
		"http://127.0.0.1:$PORT/probe/000000000000000000000001"
}
